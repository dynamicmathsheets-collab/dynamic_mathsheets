<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการการสอน: จำนวนเชิงซ้อน ม.5 (สำหรับครูผู้สอน)</title>
    <!-- Google Fonts: Kanit & Sarabun -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Kanit', sans-serif;
            background-color: #0b1120;
            display: flex;
            flex-direction: column;
        }

        /* --- แถบบาร์ด้านบนสำหรับครู (TEACHER TOP NAVBAR) --- */
        .top-navbar {
            height: 66px;
            background: #0f172a;
            border-bottom: 2px solid #8b5cf6; /* โทนสีม่วงสำหรับครู */
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
            z-index: 100;
            flex-shrink: 0;
            gap: 16px;
        }

        /* โลโก้และชื่อแถบควบคุมของครู */
        .brand-area {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 230px;
        }

        .brand-icon {
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            color: #ffffff;
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
            font-weight: 700;
            box-shadow: 0 0 12px rgba(124, 58, 237, 0.45);
        }

        .brand-title {
            color: #c4b5fd;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            white-space: nowrap;
        }

        .teacher-tag {
            background: rgba(139, 92, 246, 0.2);
            color: #a78bfa;
            border: 1px solid rgba(139, 92, 246, 0.4);
            font-size: 0.72rem;
            padding: 1px 8px;
            border-radius: 10px;
            font-weight: 500;
            margin-left: 6px;
            vertical-align: middle;
        }

        .brand-sub {
            color: #94a3b8;
            font-size: 0.75rem;
            display: block;
            margin-top: -2px;
        }

        /* เมนูปุ่มเลือกบทเรียน + ปุ่มแบบทดสอบ */
        .nav-links {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow-x: auto;
            padding: 4px;
            scrollbar-width: none;
        }
        .nav-links::-webkit-scrollbar {
            display: none;
        }

        .nav-tab {
            background: rgba(255, 255, 255, 0.05);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.92rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            outline: none;
        }

        .nav-tab:hover {
            background: rgba(139, 92, 246, 0.2);
            color: #ffffff;
            border-color: rgba(139, 92, 246, 0.4);
            transform: translateY(-1px);
        }

        .nav-tab.active {
            background: #7c3aed;
            color: #ffffff;
            font-weight: 600;
            border-color: #a78bfa;
            box-shadow: 0 2px 10px rgba(124, 58, 237, 0.5);
        }

        /* ปุ่มแบบทดสอบพิเศษ (ไฮไลต์โดดเด่น) */
        .nav-tab-exam {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(245, 158, 11, 0.2));
            color: #fde047;
            border: 1px solid rgba(245, 158, 11, 0.4);
            font-weight: 600;
            padding: 8px 16px;
            margin-left: 6px;
        }

        .nav-tab-exam:hover {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.35), rgba(245, 158, 11, 0.35));
            border-color: #fde047;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.3);
        }

        .nav-tab-exam.active {
            background: linear-gradient(135deg, #ef4444, #f59e0b);
            color: #ffffff;
            border-color: #fde047;
            box-shadow: 0 2px 12px rgba(245, 158, 11, 0.6);
        }

        /* --- พื้นที่แสดงผลเนื้อหาด้านล่าง (IFRAME) --- */
        .content-frame-container {
            flex: 1;
            width: 100%;
            height: calc(100% - 66px);
            position: relative;
            background-color: #0b1120;
        }

        #teacherFrame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- แถบบาร์ด้านบนสำหรับครู -->
    <header class="top-navbar">
        <div class="brand-area">
            <div class="brand-icon">ℂ</div>
            <div>
                <span class="brand-title">จำนวนเชิงซ้อน <span class="teacher-tag">ครูผู้สอน</span></span>
                <span class="brand-sub">สาระการเรียนรู้คณิตศาสตร์ ม.5</span>
            </div>
        </div>

        <!-- แถบปุ่มเลือกเรื่องที่ 1 ถึง 8 และปุ่มแบบทดสอบ -->
        <nav class="nav-links">
            <button class="nav-tab active" onclick="loadPage('เรื่องที่ 1.html', this)">เรื่องที่ 1</button>
            <button class="nav-tab" onclick="loadPage('เรื่องที่ 2.html', this)">เรื่องที่ 2</button>
            <button class="nav-tab" onclick="loadPage('เรื่องที่ 3.html', this)">เรื่องที่ 3</button>
            <button class="nav-tab" onclick="loadPage('เรื่องที่ 4.html', this)">เรื่องที่ 4</button>
            <button class="nav-tab" onclick="loadPage('เรื่องที่ 5.html', this)">เรื่องที่ 5</button>
            <button class="nav-tab" onclick="loadPage('เรื่องที่ 6.html', this)">เรื่องที่ 6</button>
            <button class="nav-tab" onclick="loadPage('เรื่องที่ 7.html', this)">เรื่องที่ 7</button>
            <button class="nav-tab" onclick="loadPage('เรื่องที่ 8.html', this)">เรื่องที่ 8</button>
            
            <!-- ปุ่มแบบทดสอบสำหรับครู -->
            <button class="nav-tab nav-tab-exam" onclick="loadPage('แบบทดสอบ.html', this)">📝 แบบทดสอบวัดผลสัมฤทธิ์</button>
        </nav>
    </header>

    <!-- พื้นที่แสดงเนื้อหาบทเรียนและแบบทดสอบ -->
    <main class="content-frame-container">
        <!-- เริ่มต้นด้วยการเปิดเรื่องที่ 1 ไว้เป็นค่าเริ่มต้น -->
        <iframe id="teacherFrame" src="เรื่องที่ 1.html" title="เนื้อหาการสอนและแบบทดสอบ"></iframe>
    </main>

    <script>
        function loadPage(fileName, buttonElement) {
            // โหลดไฟล์ HTML นั้นเข้ามาแสดงใน iframe
            document.getElementById('teacherFrame').src = fileName;

            // ปรับสถานะปุ่มที่กำลังเลือก (Active Tab)
            document.querySelectorAll('.nav-tab').forEach(btn => {
                btn.classList.remove('active');
            });
            buttonElement.classList.add('active');
        }
    </script>

</body>
</html>
