<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จำนวนเชิงซ้อน - สื่อการเรียนรู้สำหรับนักเรียน</title>
    <!-- Google Fonts: Kanit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Kanit', sans-serif;
            background-color: #0b1120;
            display: flex;
            flex-direction: column;
        }

        /* --- แถบบาร์ด้านบน (TOP NAVBAR) --- */
        .top-navbar {
            height: 64px;
            background: #0f172a;
            border-bottom: 2px solid #0284c7;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            z-index: 100;
            flex-shrink: 0;
        }

        /* โลโก้และชื่อเรื่อง */
        .brand-area {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 200px;
        }

        .brand-icon {
            background: linear-gradient(135deg, #0284c7, #6366f1);
            color: #ffffff;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 700;
            box-shadow: 0 0 10px rgba(2, 132, 199, 0.4);
        }

        .brand-title {
            color: #38bdf8;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            white-space: nowrap;
        }

        .brand-sub {
            color: #94a3b8;
            font-size: 0.75rem;
            display: block;
            margin-top: -3px;
        }

        /* ปุ่มเลือกบทเรียน 1 - 8 */
        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            padding: 4px;
            scrollbar-width: none;
        }
        .nav-links::-webkit-scrollbar {
            display: none;
        }

        .nav-tab {
            background: rgba(255, 255, 255, 0.05);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            outline: none;
        }

        .nav-tab:hover {
            background: rgba(56, 189, 248, 0.15);
            color: #ffffff;
            border-color: rgba(56, 189, 248, 0.4);
            transform: translateY(-1px);
        }

        .nav-tab.active {
            background: #0284c7;
            color: #ffffff;
            font-weight: 600;
            border-color: #38bdf8;
            box-shadow: 0 2px 10px rgba(2, 132, 199, 0.5);
        }

        /* --- พื้นที่แสดงเนื้อหาด้านล่าง (IFRAME) --- */
        .content-frame-container {
            flex: 1;
            width: 100%;
            height: calc(100% - 64px);
            position: relative;
            background-color: #0b1120;
        }

        #lessonFrame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- แถบบาร์ด้านบน -->
    <header class="top-navbar">
        <div class="brand-area">
            <div class="brand-icon">ℂ</div>
            <div>
                <span class="brand-title">จำนวนเชิงซ้อน</span>
                <span class="brand-sub">วิชาคณิตศาสตร์ ม.5</span>
            </div>
        </div>

        <!-- แถบปุ่มเลือกเรื่องที่ 1 ถึง 8 -->
        <nav class="nav-links">
            <button class="nav-tab active" onclick="loadLesson('เรื่องที่ 1.html', this)">เรื่องที่ 1</button>
            <button class="nav-tab" onclick="loadLesson('เรื่องที่ 2.html', this)">เรื่องที่ 2</button>
            <button class="nav-tab" onclick="loadLesson('เรื่องที่ 3.html', this)">เรื่องที่ 3</button>
            <button class="nav-tab" onclick="loadLesson('เรื่องที่ 4.html', this)">เรื่องที่ 4</button>
            <button class="nav-tab" onclick="loadLesson('เรื่องที่ 5.html', this)">เรื่องที่ 5</button>
            <button class="nav-tab" onclick="loadLesson('เรื่องที่ 6.html', this)">เรื่องที่ 6</button>
            <button class="nav-tab" onclick="loadLesson('เรื่องที่ 7.html', this)">เรื่องที่ 7</button>
            <button class="nav-tab" onclick="loadLesson('เรื่องที่ 8.html', this)">เรื่องที่ 8</button>
        </nav>
    </header>

    <!-- พื้นที่แสดงผลเนื้อหาด้านล่าง -->
    <main class="content-frame-container">
        <!-- เริ่มต้นโหลดเรื่องที่ 1 เป็นค่าเริ่มต้น -->
        <iframe id="lessonFrame" src="เรื่องที่ 1.html" title="เนื้อหาบทเรียน"></iframe>
    </main>

    <script>
        function loadLesson(fileName, buttonElement) {
            // โหลดเนื้อหาไฟล์นั้นเข้าไปใน iframe ด้านล่าง
            document.getElementById('lessonFrame').src = fileName;

            // สลับสถานะปุ่มที่เลือก (Active Tab)
            document.querySelectorAll('.nav-tab').forEach(btn => {
                btn.classList.remove('active');
            });
            buttonElement.classList.add('active');
        }
    </script>

</body>
</html>
