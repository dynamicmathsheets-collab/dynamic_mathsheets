<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บทเรียนและการประเมินผล: การแปลงเชิงเส้น</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Sarabun', sans-serif;
    }
    /* ออกแบบ Custom Scrollbar แนวนอนสำหรับแถบเมนูด้านบน */
    .menu-scrollbar::-webkit-scrollbar {
      height: 8px;
    }
    .menu-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 9999px;
    }
    .menu-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .menu-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
<script>
  // ตรวจสอบว่ามีสถานะล็อกอินและอีเมลบันทึกไว้หรือไม่
  const isLoggedIn = localStorage.getItem("dms_is_logged_in") === "true";
  const userEmail = localStorage.getItem("dms_user_email");

  // หากไม่มี ให้ดีดกลับไปหน้าเข้าสู่ระบบทันที
  if (!isLoggedIn || !userEmail) {
    // ปรับ Path ให้ถอยกลับไปหาไฟล์ login.html ตามระดับโฟลเดอร์ (เช่น "../login.html" หากอยู่ในโฟลเดอร์ย่อย 1 ชั้น)
    window.location.replace("../../login.html"); 
  }
</script>

</head>
<body class="bg-slate-100 text-slate-800 flex flex-col h-screen overflow-hidden">

  <!-- Header & Navigation Bar ด้านบน -->
  <header class="bg-white border-b border-slate-200 shadow-sm flex-shrink-0 z-20">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-lg shadow-md shadow-indigo-200">
          T
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-bold text-slate-800 leading-tight">
            การแปลงเชิงเส้น (Linear Transformation)
          </h1>

        </div>
      </div>

    </div>

    <!-- เมนูบาร์แนวนอนพร้อมแถบเลื่อน (Horizontal Scrollbar) -->
    <nav class="bg-slate-50/80 border-t border-slate-200/80 px-4 py-2">
      <div class="max-w-7xl mx-auto">
        <div id="nav-container" class="menu-scrollbar flex items-center gap-2 overflow-x-auto pb-2 pt-1 whitespace-nowrap">
          <!-- สร้างปุ่มเมนูอัตโนมัติจากรายชื่อไฟล์ -->
        </div>
      </div>
    </nav>
  </header>

  <!-- iframe สำหรับดึงไฟล์เนื้อหาแต่ละเรื่องมาแสดงด้านล่างแบบเต็มหน้าจอ -->
  <main class="flex-1 w-full bg-slate-200 relative">
    <iframe 
      id="content-frame" 
      src="1ความหมายและนิยามของการแปลงเชิงเส้น.html" 
      class="w-full h-full border-0 bg-white"
      title="เนื้อหาบทเรียน">
    </iframe>
  </main>

  <script>
    // รายชื่อไฟล์ HTML ที่ดึงมาแสดงผลตามโครงสร้างในโฟลเดอร์
    const topics = [
      { id: 1, name: "1. ความหมายและนิยาม", file: "1ความหมายและนิยามของการแปลงเชิงเส้น.html", fullName: "เรื่องที่ 1: ความหมายและนิยามของการแปลงเชิงเส้น" },
      { id: 2, name: "2. สมบัติพื้นฐาน", file: "2สมบัติพื้นฐานของการแปลงเชิงเส้น.html", fullName: "เรื่องที่ 2: สมบัติพื้นฐานของการแปลงเชิงเส้น" },
      { id: 3, name: "3. เมทริกซ์แทนการแปลง", file: "3เมทริกซ์แทนการแปลงเชิงเส้น.html", fullName: "เรื่องที่ 3: เมทริกซ์แทนการแปลงเชิงเส้น" },
      { id: 4, name: "4. เคอร์เนลและพิสัย", file: "4เคอร์เนลและพิสัยของการแปลงเชิงเส้น.html", fullName: "เรื่องที่ 4: เคอร์เนลและพิสัยของการแปลงเชิงเส้น" },
      { id: 5, name: "5. หนึ่งต่อหนึ่งและทั่วถึง", file: "5การแปลงหนึ่งต่อหนึ่งและทั่วถึง.html", fullName: "เรื่องที่ 5: การแปลงหนึ่งต่อหนึ่งและทั่วถึง" },
      { id: 6, name: "6. การประกอบและการแปลงผกผัน", file: "6การประกอบและการแปลงผกผัน.html", fullName: "เรื่องที่ 6: การประกอบและการแปลงผกผัน" },
      { id: 7, name: "7. ปริภูมิที่มีฐานกำหนด", file: "7การแปลงเชิงเส้นระหว่างปริภูมิที่มีฐานกำหนด.html", fullName: "เรื่องที่ 7: การแปลงเชิงเส้นระหว่างปริภูมิที่มีฐานกำหนด" },
      { id: 8, name: "8. ทฤษฎีบทมิติและการประยุกต์", file: "8ทฤษฎีบทมิติของการแปลงเชิงเส้นและการประยุกต์.html", fullName: "เรื่องที่ 8: ทฤษฎีบทมิติของการแปลงเชิงเส้นและการประยุกต์" },
      { id: 9, name: "📝 แบบทดสอบวัดผลสัมฤทธิ์", file: "แบบทดสอบ.html", fullName: "แบบทดสอบวัดผลสัมฤทธิ์ทางการเรียน (30 ข้อ)", isQuiz: true }
    ];

    let currentFile = topics[0].file;

    function renderNav() {
      const container = document.getElementById('nav-container');
      container.innerHTML = '';

      topics.forEach((t) => {
        const btn = document.createElement('button');
        btn.id = `nav-btn-${t.id}`;
        btn.onclick = () => loadTopic(t);

        const isActive = t.file === currentFile;
        const baseStyle = "px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center gap-1.5 flex-shrink-0 cursor-pointer shadow-sm";

        if (t.isQuiz) {
          btn.className = isActive 
            ? `${baseStyle} bg-rose-600 text-white shadow-rose-200 font-semibold ring-2 ring-rose-400`
            : `${baseStyle} bg-rose-50 text-rose-700 hover:bg-rose-100 border border-rose-200`;
        } else {
          btn.className = isActive 
            ? `${baseStyle} bg-indigo-600 text-white shadow-indigo-200 font-semibold ring-2 ring-indigo-400`
            : `${baseStyle} bg-white text-slate-700 hover:bg-slate-100 hover:text-indigo-600 border border-slate-200`;
        }

        btn.innerHTML = `<span>${t.name}</span>`;
        container.appendChild(btn);
      });
    }

    function loadTopic(topic) {
      currentFile = topic.file;
      const iframe = document.getElementById('content-frame');
      iframe.src = topic.file;

      document.getElementById('current-title').innerText = topic.fullName;
      renderNav();

      // เลื่อน Scrollbar แนวนอนให้อยู่ในมุมมองอัตโนมัติเมื่อกดเลือกเรื่อง
      const activeBtn = document.getElementById(`nav-btn-${topic.id}`);
      if (activeBtn) {
        activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }
    }

    // เริ่มต้นแสดงผลเมนูครั้งแรก
    renderNav();
  </script>
</body>
</html>
