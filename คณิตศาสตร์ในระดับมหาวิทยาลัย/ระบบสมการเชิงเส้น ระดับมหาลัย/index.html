<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บทเรียนและแบบทดสอบ: ระบบสมการเชิงเส้น</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col antialiased">

    <!-- Header & Navigation Bar ด้านบน -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 pb-2 border-b border-slate-100">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-indigo-600 animate-pulse"></span>
                    <h1 class="text-lg sm:text-xl font-bold text-slate-800">
                        ชุดบทเรียนปฏิสัมพันธ์: ระบบสมการเชิงเส้น
                    </h1>
                </div>
                <div id="current-title" class="text-xs sm:text-sm font-semibold text-indigo-700 bg-indigo-50 px-3 py-1 rounded-full border border-indigo-100 self-start md:self-auto">
                    กำลังแสดง: เรื่องที่ 1 ความหมายและรูปแบบของระบบสมการเชิงเส้น
                </div>
            </div>

            <!-- แถบเมนูปุ่มกดเลือกเรื่อง (Scroll แนวนอนได้บนจอมือถือ) -->
            <nav class="flex items-center gap-1.5 overflow-x-auto pt-2.5 pb-1 scrollbar-none text-xs sm:text-sm font-medium">
                <button onclick="loadContent('1ความหมายและรูปแบบของระบบสมการเชิงเส้น.html', this, 'เรื่องที่ 1 ความหมายและรูปแบบของระบบสมการเชิงเส้น')" 
                    class="nav-btn whitespace-nowrap px-3 py-1.5 rounded-lg border transition-all bg-indigo-600 text-white border-indigo-600 shadow-sm">
                    1. ความหมายและรูปแบบ
                </button>
                <button onclick="loadContent('2ความหมายของคำตอบและเซตคำตอบ.html', this, 'เรื่องที่ 2 ความหมายของคำตอบและเซตคำตอบ')" 
                    class="nav-btn whitespace-nowrap px-3 py-1.5 rounded-lg border transition-all bg-white text-slate-600 border-slate-200 hover:bg-slate-50 hover:text-indigo-600">
                    2. เซตคำตอบ
                </button>
                <button onclick="loadContent('3การแก้ระบบสมการด้วยการแทนค่าและการกำจัดตัวแปร.html', this, 'เรื่องที่ 3 การแก้ระบบสมการด้วยการแทนค่าและการกำจัดตัวแปร')" 
                    class="nav-btn whitespace-nowrap px-3 py-1.5 rounded-lg border transition-all bg-white text-slate-600 border-slate-200 hover:bg-slate-50 hover:text-indigo-600">
                    3. แทนค่า & กำจัดตัวแปร
                </button>
                <button onclick="loadContent('4การแก้ระบบสมการด้วยกฎของเครเมอร์.html', this, 'เรื่องที่ 4 การแก้ระบบสมการด้วยกฎของเครเมอร์')" 
                    class="nav-btn whitespace-nowrap px-3 py-1.5 rounded-lg border transition-all bg-white text-slate-600 border-slate-200 hover:bg-slate-50 hover:text-indigo-600">
                    4. กฎของเครเมอร์
                </button>
                <button onclick="loadContent('5การแก้ระบบสมการด้วยเมทริกซ์ผกผัน.html', this, 'เรื่องที่ 5 การแก้ระบบสมการด้วยเมทริกซ์ผกผัน')" 
                    class="nav-btn whitespace-nowrap px-3 py-1.5 rounded-lg border transition-all bg-white text-slate-600 border-slate-200 hover:bg-slate-50 hover:text-indigo-600">
                    5. เมทริกซ์ผกผัน
                </button>
                <button onclick="loadContent('6การจำแนกระบบสมการด้วยอันดับของเมทริกซ์.html', this, 'เรื่องที่ 6 การจำแนกระบบสมการด้วยอันดับของเมทริกซ์')" 
                    class="nav-btn whitespace-nowrap px-3 py-1.5 rounded-lg border transition-all bg-white text-slate-600 border-slate-200 hover:bg-slate-50 hover:text-indigo-600">
                    6. อันดับของเมทริกซ์
                </button>
                <button onclick="loadContent('7ระบบสมการที่มีพารามิเตอร์.html', this, 'เรื่องที่ 7 ระบบสมการที่มีพารามิเตอร์')" 
                    class="nav-btn whitespace-nowrap px-3 py-1.5 rounded-lg border transition-all bg-white text-slate-600 border-slate-200 hover:bg-slate-50 hover:text-indigo-600">
                    7. ระบบมีพารามิเตอร์
                </button>
                <button onclick="loadContent('8โครงสร้างของเซตคำตอบและการประยุกต์.html', this, 'เรื่องที่ 8 โครงสร้างของเซตคำตอบและการประยุกต์')" 
                    class="nav-btn whitespace-nowrap px-3 py-1.5 rounded-lg border transition-all bg-white text-slate-600 border-slate-200 hover:bg-slate-50 hover:text-indigo-600">
                    8. โครงสร้างเซตคำตอบ
                </button>
                <button onclick="loadContent('แบบทดสอบ.html', this, 'แบบทดสอบวัดผลสัมฤทธิ์ทางการเรียน (30 ข้อ)')" 
                    class="nav-btn whitespace-nowrap px-3.5 py-1.5 rounded-lg border transition-all bg-amber-50 text-amber-700 border-amber-300 hover:bg-amber-100 font-bold ml-1">
                    📝 แบบทดสอบ
                </button>
            </nav>
        </div>
    </header>

    <!-- พื้นที่แสดงผลผ่าน iframe ด้านล่าง -->
    <main class="flex-1 w-full p-2 sm:p-4 md:p-6 flex justify-center">
        <div class="w-full max-w-7xl bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
            <iframe 
                id="content-frame" 
                src="1ความหมายและรูปแบบของระบบสมการเชิงเส้น.html" 
                class="w-full h-full min-h-[85vh] border-0"
                onload="adjustFrameHeight(this)">
            </iframe>
        </div>
    </main>

    <script>
        // ฟังก์ชันสลับการแสดงผลไฟล์ใน iframe
        function loadContent(fileName, btnElement, titleText) {
            const frame = document.getElementById('content-frame');
            frame.src = fileName;

            // ปรับข้อความหัวเรื่องปัจจุบัน
            document.getElementById('current-title').innerText = 'กำลังแสดง: ' + titleText;

            // รีเซ็ตสไตล์ปุ่มทั้งหมด
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if (btn.innerText.includes('แบบทดสอบ')) {
                    btn.className = "nav-btn whitespace-nowrap px-3.5 py-1.5 rounded-lg border transition-all bg-amber-50 text-amber-700 border-amber-300 hover:bg-amber-100 font-bold ml-1";
                } else {
                    btn.className = "nav-btn whitespace-nowrap px-3 py-1.5 rounded-lg border transition-all bg-white text-slate-600 border-slate-200 hover:bg-slate-50 hover:text-indigo-600";
                }
            });

            // เพิ่มสไตล์ Active ให้ปุ่มที่กำลังเลือก
            if (btnElement.innerText.includes('แบบทดสอบ')) {
                btnElement.className = "nav-btn whitespace-nowrap px-3.5 py-1.5 rounded-lg border transition-all bg-amber-600 text-white border-amber-600 font-bold shadow-sm ml-1";
            } else {
                btnElement.className = "nav-btn whitespace-nowrap px-3 py-1.5 rounded-lg border transition-all bg-indigo-600 text-white border-indigo-600 shadow-sm";
            }

            // เลื่อนจอกลับขึ้นด้านบนเมื่อเปลี่ยนบทเรียน
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ปรับความสูง iframe ให้อัตโนมัติตามเนื้อหาภายใน
        function adjustFrameHeight(iframe) {
            try {
                if (iframe.contentWindow.document.body) {
                    const contentHeight = iframe.contentWindow.document.documentElement.scrollHeight;
                    iframe.style.height = (contentHeight + 40) + 'px';
                }
            } catch (e) {
                // กรณีติด Cross-Origin (เมื่อเปิดผ่าน file:// ในบางเบราว์เซอร์) จะคงค่า min-height 85vh ไว้
                iframe.style.height = '85vh';
            }
        }
    </script>
</body>
</html>
