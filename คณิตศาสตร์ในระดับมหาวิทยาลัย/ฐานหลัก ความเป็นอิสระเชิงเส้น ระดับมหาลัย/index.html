    <!-- Google Fonts: Sarabun & Prompt -->

    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }

        /* Custom styled horizontal scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            height: 7px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 9999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
            transition: background 0.2s ease;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Active Tab Styling */
        .tab-btn.active {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.28);
            border-color: transparent;
        }
        .tab-btn.active .badge-num {
            background-color: #ffffff;
            color: #4338ca;
        }
        .tab-btn.active.quiz-tab {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.28);
        }
        .tab-btn.active.quiz-tab .badge-num {
            background-color: #ffffff;
            color: #047857;
        }
    </style>
<script>
  // ตรวจสอบว่ามีสถานะล็อกอินและอีเมลบันทึกไว้หรือไม่
  const isLoggedIn = localStorage.getItem("dms_is_logged_in") === "true";
  const userEmail = localStorage.getItem("dms_user_email");

  // หากไม่มี ให้ดีดกลับไปหน้าเข้าสู่ระบบทันที
  if (!isLoggedIn || !userEmail) {
    // ปรับ Path ให้ถอยกลับไปหาไฟล์ login.html ตามระดับโฟลเดอร์ (เช่น "../login.html" หากอยู่ในโฟลเดอร์ย่อย 1 ชั้น)
    window.location.replace("../../login.html"); 
  }
</script>

</head>
<body class="bg-slate-100 text-slate-800 flex flex-col h-screen overflow-hidden">

    <!-- Top Header Bar -->

    <!-- Horizontal Scrollable Navigation Menu Bar with Scrollbar -->

                <button onclick="scrollNav(-260)" aria-label="เลื่อนซ้าย" class="hidden sm:flex flex-shrink-0 mr-2 p-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>

                <!-- Scrollable Menu Track -->
                <div id="navContainer" class="custom-scrollbar flex items-center gap-2 overflow-x-auto scroll-smooth pb-2 pt-1 w-full">
                    
                    <!-- Item 1 -->

                        <span class="badge-num w-5 h-5 rounded-full bg-slate-200 text-slate-700 font-bold text-xs flex items-center justify-center">1</span>

                        <span>ปริภูมิที่แผ่ทั่วและเซตตัวกำเนิด</span>

                    <button onclick="loadContent('3ความเป็นอิสระเชิงเส้นและการพึ่งพาเชิงเส้น.html', this)" class="tab-btn flex-shrink-0 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 hover:text-indigo-600 transition flex items-center gap-2">
                        <span class="badge-num w-5 h-5 rounded-full bg-slate-200 text-slate-700 font-bold text-xs flex items-center justify-center">3</span>
                        <span>ความเป็นอิสระเชิงเส้น</span>
                    </button>

                    <!-- Item 4 -->
                    <button onclick="loadContent('4วิธีตรวจสอบความเป็นอิสระเชิงเส้นด้วยเมทริกซ์.html', this)" class="tab-btn flex-shrink-0 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 hover:text-indigo-600 transition flex items-center gap-2">
                        <span class="badge-num w-5 h-5 rounded-full bg-slate-200 text-slate-700 font-bold text-xs flex items-center justify-center">4</span>

                    </button>

                    <!-- Item 5 -->
                    <button onclick="loadContent('5ฐานหลักของปริภูมิเวกเตอร์.html', this)" class="tab-btn flex-shrink-0 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 hover:text-indigo-600 transition flex items-center gap-2">
                        <span class="badge-num w-5 h-5 rounded-full bg-slate-200 text-slate-700 font-bold text-xs flex items-center justify-center">5</span>

                    <!-- Item 6 -->
                    <button onclick="loadContent('6มิติของปริภูมิเวกเตอร์.html', this)" class="tab-btn flex-shrink-0 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 hover:text-indigo-600 transition flex items-center gap-2">

                        <span>มิติของปริภูมิเวกเตอร์</span>
                    </button>

                    <!-- Item 7 -->

                        <span class="badge-num w-5 h-5 rounded-full bg-slate-200 text-slate-700 font-bold text-xs flex items-center justify-center">7</span>
                        <span>ฐานหลักและมิติของปริภูมิย่อย</span>
                    </button>

                    <!-- Item 8 -->
                    <button onclick="loadContent('8ทฤษฎีบทและการประยุกต์เกี่ยวกับฐานหลักและมิติ.html', this)" class="tab-btn flex-shrink-0 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 hover:text-indigo-600 transition flex items-center gap-2">
                        <span class="badge-num w-5 h-5 rounded-full bg-slate-200 text-slate-700 font-bold text-xs flex items-center justify-center">8</span>
                        <span>ทฤษฎีบทและการประยุกต์</span>
                    </button>

                    <div class="h-6 w-px bg-slate-300 flex-shrink-0 mx-1"></div>

                    <!-- Item 9: Quiz -->
                    <button onclick="loadContent('แบบทดสอบ.html', this)" class="tab-btn quiz-tab flex-shrink-0 px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold border border-emerald-300 bg-emerald-50 text-emerald-800 hover:bg-emerald-100 transition flex items-center gap-2">
                        <span class="badge-num w-5 h-5 rounded-full bg-emerald-200 text-emerald-800 font-bold text-xs flex items-center justify-center">Q</span>
                        <span>แบบทดสอบวัดผลสัมฤทธิ์ (30 ข้อ)</span>
                    </button>

                </div>

                <!-- Right Scroll Arrow Button -->
                <button onclick="scrollNav(260)" aria-label="เลื่อนขวา" class="hidden sm:flex flex-shrink-0 ml-2 p-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content Area: Responsive Iframe Container -->
    <main class="flex-1 w-full bg-slate-100 relative overflow-hidden">
        <!-- Loading spinner overlay -->
        <div id="loadingOverlay" class="absolute inset-0 bg-slate-50/80 backdrop-blur-sm z-10 flex items-center justify-center transition-opacity duration-300 opacity-0 pointer-events-none">
            <div class="flex flex-col items-center gap-3">
                <div class="w-9 h-9 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"></div>
                <div class="text-xs font-semibold text-slate-600">กำลังโหลดเนื้อหา...</div>
            </div>
        </div>

        <!-- Iframe -->
        <iframe 
            id="contentFrame" 
            src="1การรวมเชิงเส้นของเวกเตอร์.html" 
            class="w-full h-full border-0 block"
            title="เนื้อหาบทเรียนพีชคณิตเชิงเส้น"
            onload="hideLoading()">
        </iframe>
    </main>

    <!-- Logic Script -->
    <script>
        const contentFrame = document.getElementById('contentFrame');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const navContainer = document.getElementById('navContainer');

        function loadContent(filename, btnElement) {
            showLoading();
            contentFrame.src = filename;

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            if (btnElement) {
                btnElement.classList.add('active');
                btnElement.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        }

        function showLoading() {
            loadingOverlay.classList.remove('opacity-0', 'pointer-events-none');
        }

        function hideLoading() {
            loadingOverlay.classList.add('opacity-0', 'pointer-events-none');
        }

        function reloadFrame() {
            showLoading();
            contentFrame.contentWindow.location.reload();
        }

        function scrollNav(distance) {
            navContainer.scrollBy({ left: distance, behavior: 'smooth' });
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error("Fullscreen error:", err);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
