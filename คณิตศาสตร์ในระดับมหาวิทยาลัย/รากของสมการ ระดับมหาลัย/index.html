    <style>
        body {

<script>
  // ตรวจสอบว่ามีสถานะล็อกอินและอีเมลบันทึกไว้หรือไม่
  const isLoggedIn = localStorage.getItem("dms_is_logged_in") === "true";
  const userEmail = localStorage.getItem("dms_user_email");

  // หากไม่มี ให้ดีดกลับไปหน้าเข้าสู่ระบบทันที
  if (!isLoggedIn || !userEmail) {
    // ปรับ Path ให้ถอยกลับไปหาไฟล์ login.html ตามระดับโฟลเดอร์ (เช่น "../login.html" หากอยู่ในโฟลเดอร์ย่อย 1 ชั้น)
    window.location.replace("../../login.html"); 
  }
</script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased h-screen flex flex-col overflow-hidden">

    <!-- Top Navigation Header -->

        <!-- Top branding bar -->

                    ∑

                <div>
                    <h1 class="text-sm sm:text-base font-bold text-slate-900 leading-tight">บทที่ 1: รากของสมการ (Roots of Equations)</h1>
                    
                </div>
            </div>

            <!-- Utility Controls: Open in New Tab & Fullscreen -->
            <div class="flex items-center space-x-2">
                <a id="openNewTabBtn" href="1พหุนามตัวแปรเดียวและรากของสมการ.html" target="_blank" title="เปิดไฟล์ปัจจุบันในแท็บใหม่" class="inline-flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 hover:text-indigo-600 hover:bg-slate-100 border border-slate-200 transition">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    <span class="hidden md:inline">เปิดแท็บใหม่</span>
                </a>
                <button onclick="toggleFullscreen()" title="แสดงผลเต็มจอ" class="inline-flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 hover:text-indigo-600 hover:bg-slate-100 border border-slate-200 transition">
                    <i id="fsIcon" class="fa-solid fa-expand"></i>
                    <span class="hidden md:inline">เต็มจอ</span>
                </button>
            </div>
        </div>

        <!-- Horizontal Scrollable Navigation Menu Tabs (8 Topics) -->
        <nav class="max-w-7xl w-full mx-auto px-2 sm:px-6 py-2 flex items-center space-x-1.5 overflow-x-auto hide-scrollbar text-xs sm:text-sm font-medium">
            <!-- 1. พหุนามตัวแปรเดียวและรากของสมการ -->
            <button onclick="loadTopic('1พหุนามตัวแปรเดียวและรากของสมการ.html', this)" class="nav-btn active flex-shrink-0 inline-flex items-center space-x-2 px-3 py-2 rounded-xl text-slate-700 hover:bg-slate-100 transition duration-150">
                <span class="badge-num w-5 h-5 rounded-full bg-slate-200 text-slate-700 text-[11px] font-bold flex items-center justify-center">1</span>
                <span class="whitespace-nowrap font-medium">พหุนามและนิยามราก</span>
            </button>

            <!-- 2. ทฤษฎีบทเศษเหลือและทฤษฎีบทตัวประกอบ -->
            <button onclick="loadTopic('2ทฤษฎีบทเศษเหลือและทฤษฎีบทตัวประกอบ.html', this)" class="nav-btn flex-shrink-0 inline-flex items-center space-x-2 px-3 py-2 rounded-xl text-slate-700 hover:bg-slate-100 transition duration-150">
                <span class="badge-num w-5 h-5 rounded-full bg-slate-200 text-slate-700 text-[11px] font-bold flex items-center justify-center">2</span>
                <span class="whitespace-nowrap font-medium">ทฤษฎีบทเศษเหลือและตัวประกอบ</span>
            </button>

            <!-- 3. กระบวนการของฮอร์เนอร์ -->
            <button onclick="loadTopic('3กระบวนการของฮอร์เนอร์.html', this)" class="nav-btn flex-shrink-0 inline-flex items-center space-x-2 px-3 py-2 rounded-xl text-slate-700 hover:bg-slate-100 transition duration-150">
                <span class="badge-num w-5 h-5 rounded-full bg-slate-200 text-slate-700 text-[11px] font-bold flex items-center justify-center">3</span>
                <span class="whitespace-nowrap font-medium">กระบวนการของฮอร์เนอร์</span>
            </button>

            <!-- 4. สูตรของเทย์เลอร์สำหรับพหุนาม -->
            <button onclick="loadTopic('4สูตรของเทย์เลอร์สำหรับพหุนาม.html', this)" class="nav-btn flex-shrink-0 inline-flex items-center space-x-2 px-3 py-2 rounded-xl text-slate-700 hover:bg-slate-100 transition duration-150">
                <span class="badge-num w-5 h-5 rounded-full bg-slate-200 text-slate-700 text-[11px] font-bold flex items-center justify-center">4</span>
                <span class="whitespace-nowrap font-medium">สูตรของเทย์เลอร์</span>
            </button>

            <!-- 5. ความสัมพันธ์ระหว่างรากกับสัมประสิทธิ์ -->
            <button onclick="loadTopic('5ความสัมพันธ์ระหว่างรากกับสัมประสิทธิ์.html', this)" class="nav-btn flex-shrink-0 inline-flex items-center space-x-2 px-3 py-2 rounded-xl text-slate-700 hover:bg-slate-100 transition duration-150">
                <span class="badge-num w-5 h-5 rounded-full bg-slate-200 text-slate-700 text-[11px] font-bold flex items-center justify-center">5</span>
                <span class="whitespace-nowrap font-medium">สูตรของวีเอตา (Vieta)</span>
            </button>

            <!-- 6. รากตรรกยะของสมการพหุนาม -->
            <button onclick="loadTopic('6รากตรรกยะของสมการพหุนาม.html', this)" class="nav-btn flex-shrink-0 inline-flex items-center space-x-2 px-3 py-2 rounded-xl text-slate-700 hover:bg-slate-100 transition duration-150">
                <span class="badge-num w-5 h-5 rounded-full bg-slate-200 text-slate-700 text-[11px] font-bold flex items-center justify-center">6</span>
                <span class="whitespace-nowrap font-medium">รากตรรกยะ</span>
            </button>

            <!-- 7. กฎของเดการ์ตและการวิเคราะห์จำนวนราก -->
            <button onclick="loadTopic('7กฎของเดการ์ตและการวิเคราะห์จำนวนราก.html', this)" class="nav-btn flex-shrink-0 inline-flex items-center space-x-2 px-3 py-2 rounded-xl text-slate-700 hover:bg-slate-100 transition duration-150">
                <span class="badge-num w-5 h-5 rounded-full bg-slate-200 text-slate-700 text-[11px] font-bold flex items-center justify-center">7</span>
                <span class="whitespace-nowrap font-medium">กฎของเดการ์ต</span>
            </button>

            <!-- 8. แบบทดสอบวัดผลสัมฤทธิ์ทางการเรียน (เด่นชัดด้วยสไตล์พิเศษ) -->
            <button onclick="loadTopic('แบบทดสอบ.html', this)" class="nav-btn test-btn flex-shrink-0 inline-flex items-center space-x-2 px-3.5 py-2 rounded-xl text-emerald-800 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 transition duration-150">
                <span class="badge-num w-5 h-5 rounded-full bg-emerald-200 text-emerald-800 text-[11px] font-bold flex items-center justify-center">
                    <i class="fa-solid fa-file-pen text-[10px]"></i>
                </span>
                <span class="whitespace-nowrap font-bold">แบบทดสอบ (30 ข้อ)</span>
            </button>
        </nav>
    </header>

    <!-- Content Area: Responsive iframe taking 100% of remaining vertical height -->
    <main class="relative flex-1 w-full bg-slate-100 overflow-hidden">
        <!-- Loading Spinner Overlay -->
        <div id="loadingOverlay" class="absolute inset-0 bg-white/80 backdrop-blur-sm z-20 flex flex-col items-center justify-center space-y-3 transition-opacity duration-300">
            <div class="w-10 h-10 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"></div>
            <p class="text-xs font-semibold text-slate-600 font-mono">กำลังโหลดเนื้อหาบทเรียน...</p>
        </div>

        <!-- iframe container -->
        <iframe 
            id="contentFrame" 
            src="1พหุนามตัวแปรเดียวและรากของสมการ.html" 
            class="w-full h-full border-0 block"
            title="พื้นที่แสดงบทเรียน"
            onload="hideLoading()">
        </iframe>
    </main>

    <!-- JavaScript Controllers -->
    <script>
        const contentFrame = document.getElementById('contentFrame');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const openNewTabBtn = document.getElementById('openNewTabBtn');
        const fsIcon = document.getElementById('fsIcon');

        // Function to load selected topic file into iframe
        function loadTopic(fileName, buttonElement) {
            // Show loading animation
            loadingOverlay.style.opacity = '1';
            loadingOverlay.style.pointerEvents = 'auto';

            // Change iframe source
            contentFrame.src = encodeURI(fileName);

            // Update Open in New Tab Button
            openNewTabBtn.href = encodeURI(fileName);

            // Update active button state
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            if (buttonElement) {
                buttonElement.classList.add('active');
                // Scroll selected tab into view smoothly on mobile
                buttonElement.scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' });
            }
        }

        // Hide loading spinner when iframe completes loading
        function hideLoading() {
            loadingOverlay.style.opacity = '0';
            setTimeout(() => {
                loadingOverlay.style.pointerEvents = 'none';
            }, 300);
        }

        // Toggle Fullscreen Mode
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    fsIcon.className = 'fa-solid fa-compress';
                }).catch(err => {
                    console.warn(`Fullscreen error: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen().then(() => {
                        fsIcon.className = 'fa-solid fa-expand';
                    });
                }
            }
        }

        // Listen for browser fullscreen changes (e.g. user presses Esc key)
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                fsIcon.className = 'fa-solid fa-expand';
            } else {
                fsIcon.className = 'fa-solid fa-compress';
            }
        });
    </script>
</body>
</html>
