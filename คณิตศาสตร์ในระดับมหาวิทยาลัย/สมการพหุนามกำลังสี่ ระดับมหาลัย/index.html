<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>พอร์ทัลบทเรียนสมการพหุนามกำลังสี่ | Quartic Polynomial Equations Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        }
                    },
                    fontFamily: {
                        sans: ['Prompt', 'Sarabun', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts: Prompt & Sarabun -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
        }
        /* Custom scrollbar for horizontal menu */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<script>
  // ตรวจสอบว่ามีสถานะล็อกอินและอีเมลบันทึกไว้หรือไม่
  const isLoggedIn = localStorage.getItem("dms_is_logged_in") === "true";
  const userEmail = localStorage.getItem("dms_user_email");

  // หากไม่มี ให้ดีดกลับไปหน้าเข้าสู่ระบบทันที
  if (!isLoggedIn || !userEmail) {
    // ปรับ Path ให้ถอยกลับไปหาไฟล์ login.html ตามระดับโฟลเดอร์ (เช่น "../login.html" หากอยู่ในโฟลเดอร์ย่อย 1 ชั้น)
    window.location.replace("../../login.html"); 
  }
</script>
</head>
<body class="h-full flex flex-col bg-slate-900 text-slate-100 overflow-hidden select-none">

    <!-- Top Navigation Header -->
    <header class="bg-slate-900/95 border-b border-slate-800 backdrop-blur-md z-40 flex-shrink-0 shadow-lg">
        <!-- Main Brand & Quick Controls Bar -->
        <div class="max-w-7xl mx-auto px-3 sm:px-6 py-2.5 flex items-center justify-between gap-3">
            
            <!-- Logo & Title -->
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-teal-400 flex items-center justify-center text-white shadow-md shadow-indigo-500/20 flex-shrink-0">
                    <i class="fa-solid fa-superscript text-base sm:text-lg"></i>
                </div>
                <div class="truncate">
                    <h1 class="text-sm sm:text-base font-bold text-white truncate leading-tight">
                        สมการพหุนามกำลังสี่ <span class="text-indigo-400 text-xs sm:text-sm font-normal hidden md:inline">| Quartic Equations Learning Portal</span>
                    </h1>
                </div>
            </div>

            <!-- Global Action Controls (Prev, Next, Reload, Fullscreen) -->
            <div class="flex items-center gap-1.5 sm:gap-2 flex-shrink-0">
                <!-- Previous Button -->
                <button onclick="navigateLesson(-1)" id="btnPrev" class="px-2.5 py-1.5 text-xs font-medium rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white border border-slate-700/80 transition-all flex items-center gap-1.5 disabled:opacity-30 disabled:pointer-events-none" title="เรื่องก่อนหน้า">
                    <i class="fa-solid fa-chevron-left"></i>
                    <span class="hidden sm:inline">ก่อนหน้า</span>
                </button>

                <!-- Next Button -->
                <button onclick="navigateLesson(1)" id="btnNext" class="px-2.5 py-1.5 text-xs font-medium rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white border border-slate-700/80 transition-all flex items-center gap-1.5 disabled:opacity-30 disabled:pointer-events-none" title="เรื่องถัดไป">
                    <span class="hidden sm:inline">ถัดไป</span>
                    <i class="fa-solid fa-chevron-right"></i>
                </button>

                <!-- Divider -->
                <div class="h-5 w-px bg-slate-700/80 mx-0.5"></div>

                <!-- Reload Button -->
                <button onclick="reloadFrame()" class="p-2 text-xs rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white border border-slate-700/80 transition-all" title="โหลดบทเรียนนี้ใหม่">
                    <i id="reloadIcon" class="fa-solid fa-arrow-rotate-right"></i>
                </button>

                <!-- Fullscreen Button -->
                <button onclick="toggleFullscreen()" class="p-2 text-xs rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white border border-slate-700/80 transition-all" title="ขยายเต็มหน้าจอ">
                    <i id="fullscreenIcon" class="fa-solid fa-expand"></i>
                </button>
            </div>
        </div>

        <!-- Topic Tabs Navigation Bar (Scrollable on mobile) -->
        <div class="bg-slate-950/70 border-t border-slate-800/80">
            <div class="max-w-7xl mx-auto px-2 sm:px-6">
                <nav id="navTabsContainer" class="flex items-center gap-1.5 py-2 overflow-x-auto no-scrollbar scroll-smooth" aria-label="Tabs">
                    <!-- Dynamic tabs will be rendered here by JavaScript -->
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content Area with Iframe Container -->
    <main id="contentContainer" class="flex-1 w-full relative bg-slate-950 flex flex-col overflow-hidden">
        
        <!-- Loading Progress Bar -->
        <div id="loadingIndicator" class="absolute top-0 left-0 right-0 h-1 bg-slate-800 z-30 overflow-hidden">
            <div class="h-full bg-gradient-to-r from-indigo-500 via-teal-400 to-indigo-500 w-1/3 animate-pulse rounded-full"></div>
        </div>

        <!-- Embedded Content Frame -->
        <iframe 
            id="lessonFrame" 
            name="lessonFrame"
            src="1รูปทั่วไปและการลดรูปสมการกำลังสี่.html" 
            class="w-full h-full flex-1 border-0 bg-white"
            onload="onFrameLoaded()"
            title="เนื้อหาบทเรียนสมการกำลังสี่"
        ></iframe>

        <!-- Error/Offline Fallback Toast (Hidden by default) -->
        <div id="fallbackNotice" class="hidden absolute bottom-4 right-4 bg-slate-900 border border-slate-700 text-slate-300 px-4 py-3 rounded-xl shadow-2xl z-50 text-xs flex items-center gap-3">
            <i class="fa-solid fa-circle-info text-indigo-400 text-base"></i>
            <div>
                <p class="font-bold text-white">กำลังเปิดไฟล์: <span id="currentFileName" class="font-mono text-indigo-300"></span></p>
                <p class="text-[11px] text-slate-400">กรุณาตรวจสอบว่าวางไฟล์ HTML ทั้ง 7 ไฟล์ไว้ในโฟลเดอร์เดียวกัน</p>
            </div>
        </div>
    </main>

    <!-- Portal Logic -->
    <script>
        // List of all 7 lessons mapped exactly to your local filenames
        const lessons = [
            {
                id: 1,
                title: "1. รูปทั่วไปและการลดรูป",
                fullTitle: "เรื่องที่ 1: รูปทั่วไปและการลดรูปสมการกำลังสี่",
                file: "1รูปทั่วไปและการลดรูปสมการกำลังสี่.html",
                icon: "fa-solid fa-shapes",
                isQuiz: false
            },
            {
                id: 2,
                title: "2. การแยกตัวประกอบ",
                fullTitle: "เรื่องที่ 2: การแยกตัวประกอบและการลดสมการกำลังสี่",
                file: "2การแยกตัวประกอบและการลดสมการกำลังสี่.html",
                icon: "fa-solid fa-puzzle-piece",
                isQuiz: false
            },
            {
                id: 3,
                title: "3. วิธีของแฟร์รารี",
                fullTitle: "เรื่องที่ 3: วิธีของแฟร์รารี (Ferrari's Method)",
                file: "3วิธีของแฟร์รารี (Ferrari's Method).html",
                icon: "fa-solid fa-cube",
                isQuiz: false
            },
            {
                id: 4,
                title: "4. การแก้สมการแฟร์รารี",
                fullTitle: "เรื่องที่ 4: การแก้สมการด้วยวิธีแฟร์รารี",
                file: "4การแก้สมการด้วยวิธีแฟร์รารี.html",
                icon: "fa-solid fa-calculator",
                isQuiz: false
            },
            {
                id: 5,
                title: "5. รากและสูตรวีเอตา",
                fullTitle: "เรื่องที่ 5: การวิเคราะห์รากและความสัมพันธ์กับสัมประสิทธิ์",
                file: "5การวิเคราะห์รากและความสัมพันธ์กับสัมประสิทธิ์.html",
                icon: "fa-solid fa-infinity",
                isQuiz: false
            },
            {
                id: 6,
                title: "6. การเลือกวิธีแก้",
                fullTitle: "เรื่องที่ 6: การเลือกวิธีแก้และการประยุกต์สมการกำลังสี่",
                file: "6การเลือกวิธีแก้และการประยุกต์สมการกำลังสี่.html",
                icon: "fa-solid fa-compass-drafting",
                isQuiz: false
            },
            {
                id: 7,
                title: "แบบทดสอบวัดผล",
                fullTitle: "แบบทดสอบวัดผลสัมฤทธิ์ทางการเรียน (30 ข้อ)",
                file: "แบบทดสอบ.html",
                icon: "fa-solid fa-clipboard-check",
                isQuiz: true
            }
        ];

        let currentIndex = 0;

        // Render Tabs in Navbar
        function renderTabs() {
            const container = document.getElementById('navTabsContainer');
            container.innerHTML = '';

            lessons.forEach((item, index) => {
                const isActive = (index === currentIndex);
                const btn = document.createElement('button');
                btn.id = `tabBtn_${index}`;
                btn.onclick = () => loadLesson(index);

                if (item.isQuiz) {
                    // Special styling for Quiz Tab
                    btn.className = `flex-shrink-0 flex items-center gap-2 px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all ${
                        isActive 
                            ? 'bg-gradient-to-r from-amber-500 to-rose-600 text-white shadow-lg shadow-rose-900/30 ring-2 ring-amber-400' 
                            : 'bg-amber-500/10 text-amber-300 border border-amber-500/30 hover:bg-amber-500/20 hover:text-amber-200'
                    }`;
                    btn.innerHTML = `
                        <i class="${item.icon} text-amber-300"></i>
                        <span>${item.title}</span>
                        <span class="px-1.5 py-0.2 rounded text-[10px] bg-rose-600 text-white font-mono">30 ข้อ</span>
                    `;
                } else {
                    // Standard Lesson Tabs
                    btn.className = `flex-shrink-0 flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${
                        isActive 
                            ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30 font-semibold ring-1 ring-indigo-400' 
                            : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900 border border-transparent'
                    }`;
                    btn.innerHTML = `
                        <i class="${item.icon} ${isActive ? 'text-indigo-200' : 'text-slate-500'}"></i>
                        <span>${item.title}</span>
                    `;
                }

                container.appendChild(btn);
            });

            // Update Navigation Buttons (Next / Prev)
            document.getElementById('btnPrev').disabled = (currentIndex === 0);
            document.getElementById('btnNext').disabled = (currentIndex === lessons.length - 1);
            document.getElementById('currentStatusBadge').innerText = `${currentIndex + 1} / ${lessons.length}: ${lessons[currentIndex].title}`;
            
            // Auto scroll active tab into view
            const activeTab = document.getElementById(`tabBtn_${currentIndex}`);
            if (activeTab) {
                activeTab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        }

        // Load a specific lesson by index into iframe
        function loadLesson(index) {
            if (index < 0 || index >= lessons.length) return;
            currentIndex = index;
            const targetLesson = lessons[index];

            // Show loading bar
            const indicator = document.getElementById('loadingIndicator');
            indicator.classList.remove('hidden');

            // Set iframe source
            const frame = document.getElementById('lessonFrame');
            frame.src = encodeURI(targetLesson.file);

            // Update toast filename notice
            document.getElementById('currentFileName').innerText = targetLesson.file;
            const toast = document.getElementById('fallbackNotice');
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3500);

            renderTabs();
        }

        // Next / Previous Navigation
        function navigateLesson(offset) {
            const nextIdx = currentIndex + offset;
            if (nextIdx >= 0 && nextIdx < lessons.length) {
                loadLesson(nextIdx);
            }
        }

        // Reload iframe content
        function reloadFrame() {
            const frame = document.getElementById('lessonFrame');
            const icon = document.getElementById('reloadIcon');
            icon.classList.add('fa-spin');
            frame.src = frame.src;
            setTimeout(() => {
                icon.classList.remove('fa-spin');
            }, 750);
        }

        // Toggle Fullscreen mode
        function toggleFullscreen() {
            const icon = document.getElementById('fullscreenIcon');
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    icon.className = 'fa-solid fa-compress';
                }).catch(err => {
                    console.warn("Fullscreen request error:", err);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen().then(() => {
                        icon.className = 'fa-solid fa-expand';
                    });
                }
            }
        }

        // Event when iframe finishes loading
        function onFrameLoaded() {
            const indicator = document.getElementById('loadingIndicator');
            indicator.classList.add('hidden');
        }

        // Keyboard Shortcut: Left / Right arrows for quick switching
        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === 'ArrowRight') {
                navigateLesson(1);
            } else if (e.key === 'ArrowLeft') {
                navigateLesson(-1);
            }
        });

        // Initialize portal on load
        window.onload = function() {
            renderTabs();
        };
    </script>
</body>
</html>
