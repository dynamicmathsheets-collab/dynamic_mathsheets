<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บทเรียน: จำนวนเชิงซ้อน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .nav-scroll::-webkit-scrollbar { height: 4px; }
    .nav-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 9999px; }
  </style>
<script>
  // ตรวจสอบว่ามีสถานะล็อกอินและอีเมลบันทึกไว้หรือไม่
  const isLoggedIn = localStorage.getItem("dms_is_logged_in") === "true";
  const userEmail = localStorage.getItem("dms_user_email");

  // หากไม่มี ให้ดีดกลับไปหน้าเข้าสู่ระบบทันที
  if (!isLoggedIn || !userEmail) {
    // ปรับ Path ให้ถอยกลับไปหาไฟล์ login.html ตามระดับโฟลเดอร์ (เช่น "../login.html" หากอยู่ในโฟลเดอร์ย่อย 1 ชั้น)
    window.location.replace("../../login.html"); 
  }
</script>
</head>
<body class="bg-slate-100 flex flex-col h-screen overflow-hidden">

  <!-- แถบบาร์ด้านบน -->
  <header class="bg-gradient-to-r from-slate-950 via-indigo-950 to-slate-900 border-b border-indigo-900/60 shadow-md shrink-0">
    <div class="max-w-6xl w-full mx-auto px-4 py-2.5 flex items-center justify-between border-b border-white/10 text-white">
      <div class="font-bold text-base flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-indigo-500 animate-pulse"></span>
        <span>บทเรียน: จำนวนเชิงซ้อน</span>
      </div>
      <div class="text-xs text-slate-400">เลือกบทเรียนเพื่อเริ่มเรียนรู้</div>
    </div>

    <!-- เมนูปุ่มกดแท็บ -->
    <div class="max-w-6xl w-full mx-auto px-4 py-2">
      <nav class="flex items-center gap-2 overflow-x-auto nav-scroll whitespace-nowrap text-xs sm:text-sm">
        <button onclick="loadPage('1จำนวนเชิงซ้อนและระนาบเชิงซ้อน.html', this)" class="tab-btn px-3 py-1.5 rounded-lg bg-indigo-600 text-white font-bold transition">1. รู้จักจำนวนเชิงซ้อน</button>
        <button onclick="loadPage('2การดำเนินการกับจำนวนเชิงซ้อน.html', this)" class="tab-btn px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:text-white transition">2. การดำเนินการ</button>
        <button onclick="loadPage('3โมดูลัสและอาร์กิวเมนต์.html', this)" class="tab-btn px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:text-white transition">3. โมดูลัสและอาร์กิวเมนต์</button>
        <button onclick="loadPage('4รูปเชิงขั้วและการคูณหารจำนวนเชิงซ้อน.html', this)" class="tab-btn px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:text-white transition">4. รูปเชิงขั้ว</button>
        <button onclick="loadPage('5ทฤษฎีบทเดอมัวฟร์และรากที่ n.html', this)" class="tab-btn px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:text-white transition">5. เดอมัวฟร์และรากที่ n</button>
        <button onclick="loadPage('6รากสังยุคและการเชื่อมโยงกับสมการพหุนาม.html', this)" class="tab-btn px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:text-white transition">6. รากสังยุคและพหุนาม</button>
        <button onclick="loadPage('7แบบทดสอบ.html', this)" class="tab-btn px-3 py-1.5 rounded-lg bg-emerald-900/90 border border-emerald-600 text-emerald-300 font-bold transition">7. แบบทดสอบ (30 ข้อ)</button>
      </nav>
    </div>
  </header>

  <!-- แสดงเนื้อหาแต่ละเรื่องต่อด้านล่างตรงนี้ทันที -->
  <main class="flex-1 w-full bg-slate-50">
    <iframe id="contentFrame" src="1จำนวนเชิงซ้อนและระนาบเชิงซ้อน.html" class="w-full h-full border-0"></iframe>
  </main>

  <script>
    function loadPage(url, btn) {
      // เปลี่ยนหน้าใน iframe ทันที
      document.getElementById('contentFrame').src = url;

      // จัดการสีปุ่ม
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.className = "tab-btn px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:text-white transition";
      });
      if (url.includes('7แบบทดสอบ')) {
        btn.className = "tab-btn px-3 py-1.5 rounded-lg bg-emerald-600 text-white font-bold transition";
      } else {
        btn.className = "tab-btn px-3 py-1.5 rounded-lg bg-indigo-600 text-white font-bold transition";
      }
    }
  </script>
</body>
</html>
