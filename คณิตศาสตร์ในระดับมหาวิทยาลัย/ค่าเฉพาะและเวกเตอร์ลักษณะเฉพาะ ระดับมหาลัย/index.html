      onload="onIframeLoaded()">

  <!-- Script for Navigation, State, and Iframe Handling -->
  <script>
    // File registry matching folder contents exactly
    const topics = [
      {
        id: 1,
        title: "1. ความหมายของค่าเฉพาะและเวกเตอร์ลักษณะเฉพาะ",
        filename: "1ความหมายของค่าเฉพาะและเวกเตอร์ลักษณะเฉพาะ.html"
      },
      {
        id: 2,
        title: "2. สมการลักษณะเฉพาะและพหุนามลักษณะเฉพาะ",
        filename: "2สมการลักษณะเฉพาะและพหุนามลักษณะเฉพาะ.html"
      },
      {
        id: 3,
        title: "3. ปริภูมิลักษณะเฉพาะและเวกเตอร์ลักษณะเฉพาะ",
        filename: "3ปริภูมิลักษณะเฉพาะและเวกเตอร์ลักษณะเฉพาะ.html"
      },
      {
        id: 4,
        title: "4. พหุคูณของค่าเฉพาะและทฤษฎีบทสำคัญ",
        filename: "4พหุคูณของค่าเฉพาะและทฤษฎีบทสำคัญ.html"
      },
      {
        id: 5,
        title: "5. ความเป็นอิสระเชิงเส้นของเวกเตอร์ลักษณะเฉพาะ",
        filename: "5ความเป็นอิสระเชิงเส้นของเวกเตอร์ลักษณะเฉพาะ.html"
      },
      {
        id: 6,
        title: "6. การทำให้เมทริกซ์เป็นแนวทแยง",
        filename: "6การทำให้เมทริกซ์เป็นแนวทแยง.html"
      },
      {
        id: 7,
        title: "7. การประยุกต์เมทริกซ์แนวทแยงและเมทริกซ์กำลังสูง",
        filename: "7การประยุกต์เมทริกซ์แนวทแยงและเมทริกซ์กำลังสูง.html"
      },
      {
        id: 8,
        title: "8. การประยุกต์และการสังเคราะห์ความรู้เรื่องค่าเฉพาะ",
        filename: "8การประยุกต์และการสังเคราะห์ความรู้เรื่องค่าเฉพาะ.html"
      },
      {
        id: 9,
        title: "แบบทดสอบวัดผลสัมฤทธิ์ทางการเรียน (30 ข้อ)",
        filename: "แบบทดสอบ.html"
      }
    ];

    let currentTabIndex = 0;

    function switchTab(index) {
      if (index < 0 || index >= topics.length) return;
      currentTabIndex = index;

      const target = topics[index];
      const frame = document.getElementById('contentFrame');
      const loader = document.getElementById('loadingOverlay');
      const label = document.getElementById('currentTopicLabel');

      // Show loader
      loader.classList.remove('opacity-0', 'pointer-events-none');

      // Update frame source
      frame.src = target.filename;

      // Update label
      if (label) {
        label.innerText = target.title;
      }

      // Update Tab Styles
      for (let i = 0; i < topics.length; i++) {
        const tab = document.getElementById(`tab-${i}`);
        if (!tab) continue;

        if (i === 8) {
          // Quiz Tab Styling
          if (i === index) {
            tab.className = "tab-item shrink-0 px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all flex items-center gap-2 border whitespace-nowrap bg-emerald-500 text-white border-emerald-300 ring-2 ring-emerald-400/50 shadow-lg shadow-emerald-500/30";
          } else {
            tab.className = "tab-item shrink-0 px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all flex items-center gap-2 border whitespace-nowrap bg-gradient-to-r from-emerald-600 to-teal-600 text-white border-emerald-400/50 hover:from-emerald-500 hover:to-teal-500 shadow-md shadow-emerald-500/20";
          }
        } else {
          // Lessons 1-8 Styling
          if (i === index) {
            tab.className = "tab-item shrink-0 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium transition-all flex items-center gap-2 border whitespace-nowrap bg-brand-600 text-white border-brand-400/40 shadow-lg shadow-brand-500/20";
            const numBadge = tab.querySelector('span');
            if (numBadge) numBadge.className = "w-5 h-5 rounded-full bg-white/20 flex items-center justify-center font-bold text-[11px] text-white";
          } else {
            tab.className = "tab-item shrink-0 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium transition-all flex items-center gap-2 border whitespace-nowrap bg-slate-900 text-slate-300 border-slate-800 hover:bg-slate-800 hover:text-white";
            const numBadge = tab.querySelector('span');
            if (numBadge) numBadge.className = "w-5 h-5 rounded-full bg-slate-800 flex items-center justify-center font-bold text-[11px] text-slate-400";
          }
        }
      }

      // Smooth scroll selected button into viewport view
      const activeTab = document.getElementById(`tab-${index}`);
      if (activeTab) {
        activeTab.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }
    }

    function onIframeLoaded() {
      const loader = document.getElementById('loadingOverlay');
      if (loader) {
        loader.classList.add('opacity-0', 'pointer-events-none');
      }
    }

    // Scroll menu container with arrow buttons
    function scrollMenu(direction) {
      const container = document.getElementById('menuContainer');
      const scrollAmount = 260;
      if (direction === 'left') {
        container.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
      } else {
        container.scrollBy({ left: scrollAmount, behavior: 'smooth' });
      }
    }

    // Toolbar utilities
    function reloadIframe() {
      const frame = document.getElementById('contentFrame');
      const loader = document.getElementById('loadingOverlay');
      loader.classList.remove('opacity-0', 'pointer-events-none');
      frame.src = frame.src;
    }

    function openInNewTab() {
      const current = topics[currentTabIndex];
      window.open(current.filename, '_blank');
    }

    function toggleFullscreen() {
      const wrapper = document.getElementById('iframeWrapper');
      if (!document.fullscreenElement) {
        wrapper.requestFullscreen().catch(err => console.error(err));
      } else {
        document.exitFullscreen();
      }
    }
  </script>
