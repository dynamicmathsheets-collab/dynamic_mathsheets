<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บทเรียนออนไลน์: เวกเตอร์และพีชคณิตเชิงเส้น</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Prompt & Sarabun -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    body {
      font-family: 'Sarabun', sans-serif;
    }
    h1, h2, h3, h4, .font-heading, button {
      font-family: 'Prompt', sans-serif;
    }
    .custom-scroll::-webkit-scrollbar {
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 9999px;
    }
    .nav-btn.active {
      background-color: #4f46e5;
      color: #ffffff;
      box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
    }
  </style>
<script>
  // ตรวจสอบว่ามีสถานะล็อกอินและอีเมลบันทึกไว้หรือไม่
  const isLoggedIn = localStorage.getItem("dms_is_logged_in") === "true";
  const userEmail = localStorage.getItem("dms_user_email");

  // หากไม่มี ให้ดีดกลับไปหน้าเข้าสู่ระบบทันที
  if (!isLoggedIn || !userEmail) {
    // ปรับ Path ให้ถอยกลับไปหาไฟล์ login.html ตามระดับโฟลเดอร์ (เช่น "../login.html" หากอยู่ในโฟลเดอร์ย่อย 1 ชั้น)
    window.location.replace("../../login.html"); 
  }
</script>
</head>
<body class="bg-slate-100 flex flex-col h-screen overflow-hidden">

  <!-- Top Navigation Header -->
  <header class="bg-white border-b border-slate-200/90 shadow-sm shrink-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6">
      
      <!-- Top Brand Row -->
      <div class="flex items-center justify-between py-3 border-b border-slate-100">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-blue-500 text-white flex items-center justify-center text-xl shadow-md">
            <i class="fa-solid fa-shapes"></i>
          </div>
          <div>
            <h1 class="text-lg sm:text-xl font-bold text-slate-900 tracking-tight leading-tight">
              สื่อการเรียนรู้ออนไลน์: เวกเตอร์และพีชคณิตเชิงเส้น
            </h1>
          </div>
        </div>

      </div>

      <!-- Navigation Tabs (Horizontal Scrollable) -->
      <nav class="flex items-center gap-2 py-2.5 overflow-x-auto custom-scroll text-xs sm:text-sm font-medium">
        <button onclick="loadContent(1, '1 ความหมายและองค์ประกอบของเวกเตอร์.html')" id="btn-1" class="nav-btn active px-3.5 py-1.5 rounded-xl whitespace-nowrap transition-all duration-200 flex items-center gap-1.5 bg-slate-100 text-slate-700 hover:bg-slate-200">
          <span class="w-5 h-5 rounded-full bg-black/10 flex items-center justify-center text-[10px] font-bold">1</span>
          <span>ความหมายและองค์ประกอบ</span>
        </button>

        <button onclick="loadContent(2, '2 การดำเนินการของเวกเตอร์.html')" id="btn-2" class="nav-btn px-3.5 py-1.5 rounded-xl whitespace-nowrap transition-all duration-200 flex items-center gap-1.5 bg-slate-100 text-slate-700 hover:bg-slate-200">
          <span class="w-5 h-5 rounded-full bg-black/10 flex items-center justify-center text-[10px] font-bold">2</span>
          <span>การดำเนินการของเวกเตอร์</span>
        </button>

        <button onclick="loadContent(3, '3 ผลคูณเชิงสเกลาร์.html')" id="btn-3" class="nav-btn px-3.5 py-1.5 rounded-xl whitespace-nowrap transition-all duration-200 flex items-center gap-1.5 bg-slate-100 text-slate-700 hover:bg-slate-200">
          <span class="w-5 h-5 rounded-full bg-black/10 flex items-center justify-center text-[10px] font-bold">3</span>
          <span>ผลคูณเชิงสเกลาร์ (Dot)</span>
        </button>

        <button onclick="loadContent(4, '4 ผลคูณเชิงเวกเตอร์.html')" id="btn-4" class="nav-btn px-3.5 py-1.5 rounded-xl whitespace-nowrap transition-all duration-200 flex items-center gap-1.5 bg-slate-100 text-slate-700 hover:bg-slate-200">
          <span class="w-5 h-5 rounded-full bg-black/10 flex items-center justify-center text-[10px] font-bold">4</span>
          <span>ผลคูณเชิงเวกเตอร์ (Cross)</span>
        </button>

        <button onclick="loadContent(5, '5 การรวมเชิงเส้นและการพึ่งพิงเชิงเส้น.html')" id="btn-5" class="nav-btn px-3.5 py-1.5 rounded-xl whitespace-nowrap transition-all duration-200 flex items-center gap-1.5 bg-slate-100 text-slate-700 hover:bg-slate-200">
          <span class="w-5 h-5 rounded-full bg-black/10 flex items-center justify-center text-[10px] font-bold">5</span>
          <span>การรวมและการพึ่งพิงเชิงเส้น</span>
        </button>

        <button onclick="loadContent(6, '6 ปริภูมิเวกเตอร์และปริภูมิย่อย.html')" id="btn-6" class="nav-btn px-3.5 py-1.5 rounded-xl whitespace-nowrap transition-all duration-200 flex items-center gap-1.5 bg-slate-100 text-slate-700 hover:bg-slate-200">
          <span class="w-5 h-5 rounded-full bg-black/10 flex items-center justify-center text-[10px] font-bold">6</span>
          <span>ปริภูมิและปริภูมิย่อย</span>
        </button>

        <button onclick="loadContent(7, '7 ฐานและมิติของปริภูมิเวกเตอร์.html')" id="btn-7" class="nav-btn px-3.5 py-1.5 rounded-xl whitespace-nowrap transition-all duration-200 flex items-center gap-1.5 bg-slate-100 text-slate-700 hover:bg-slate-200">
          <span class="w-5 h-5 rounded-full bg-black/10 flex items-center justify-center text-[10px] font-bold">7</span>
          <span>ฐานและมิติ</span>
        </button>

        <button onclick="loadContent(8, '8 การประยุกต์เวกเตอร์และการเปลี่ยนฐาน.html')" id="btn-8" class="nav-btn px-3.5 py-1.5 rounded-xl whitespace-nowrap transition-all duration-200 flex items-center gap-1.5 bg-slate-100 text-slate-700 hover:bg-slate-200">
          <span class="w-5 h-5 rounded-full bg-black/10 flex items-center justify-center text-[10px] font-bold">8</span>
          <span>การประยุกต์ & การเปลี่ยนฐาน</span>
        </button>

        <!-- Test Tab -->
        <button onclick="loadContent(9, 'แบบทดสอบ.html')" id="btn-9" class="nav-btn px-4 py-1.5 rounded-xl whitespace-nowrap transition-all duration-200 flex items-center gap-1.5 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 border border-indigo-200">
          <i class="fa-solid fa-graduation-cap text-indigo-600"></i>
          <span class="font-bold">แบบทดสอบวัดผลสัมฤทธิ์</span>
        </button>
      </nav>

    </div>
  </header>

  <!-- Main Content Viewer: iframe takes remaining height -->
  <main class="flex-1 w-full relative bg-slate-50">
    <!-- Loading spinner placeholder -->
    <div id="loader" class="absolute inset-0 flex items-center justify-center bg-slate-50/80 z-10 transition-opacity duration-300 pointer-events-none opacity-0">
      <div class="flex flex-col items-center gap-2">
        <i class="fa-solid fa-circle-notch fa-spin text-3xl text-indigo-600"></i>
        <span class="text-xs text-slate-500 font-medium font-heading">กำลังโหลดเนื้อหา...</span>
      </div>
    </div>

    <!-- The iframe directly loading matching HTML files -->
    <iframe 
      id="contentFrame" 
      src="1 ความหมายและองค์ประกอบของเวกเตอร์.html" 
      class="w-full h-full border-none shadow-inner"
      onload="hideLoader()"
    ></iframe>
  </main>

  <!-- Script for Tab Navigation -->
  <script>
    let currentSrc = '1 ความหมายและองค์ประกอบของเวกเตอร์.html';

    function loadContent(tabIndex, fileName) {
      currentSrc = fileName;
      showLoader();
      
      const frame = document.getElementById('contentFrame');
      frame.src = encodeURI(fileName);

      // Update button styling
      document.querySelectorAll('.nav-btn').forEach((btn, idx) => {
        if (idx + 1 === tabIndex) {
          btn.classList.add('active');
          if (idx + 1 === 9) {
            btn.classList.remove('bg-indigo-50', 'text-indigo-700');
            btn.classList.add('bg-indigo-600', 'text-white');
          } else {
            btn.classList.remove('bg-slate-100', 'text-slate-700');
          }
        } else {
          btn.classList.remove('active');
          if (idx + 1 === 9) {
            btn.classList.remove('bg-indigo-600', 'text-white');
            btn.classList.add('bg-indigo-50', 'text-indigo-700');
          } else {
            btn.classList.add('bg-slate-100', 'text-slate-700');
          }
        }
      });
    }

    function reloadFrame() {
      showLoader();
      const frame = document.getElementById('contentFrame');
      frame.src = frame.src;
    }

    function openExternal() {
      window.open(currentSrc, '_blank');
    }

    function showLoader() {
      const loader = document.getElementById('loader');
      loader.classList.remove('opacity-0');
      loader.classList.add('opacity-100');
    }

    function hideLoader() {
      const loader = document.getElementById('loader');
      loader.classList.remove('opacity-100');
      loader.classList.add('opacity-0');
    }
  </script>
</body>
</html>
