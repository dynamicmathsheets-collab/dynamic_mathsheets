<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Mathsheets</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Sarabun', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      /* พื้นหลังโทนสว่างนุ่มนวล ไม่สะท้อนตา อมเขียวธรรมชาติจางๆ */
      background-color: #f8faf8;
      background: radial-gradient(circle at center, #ffffff 0%, #f7faf8 55%, #edf3ef 100%);
      color: #2d3b34;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      text-align: center;
    }

    h1 {
      color: #234233; /* เขียวเข้มสุภาพ อ่านชัดแต่นุ่มนวล */
      font-size: 32px;
      font-weight: 500;
      margin-bottom: 30px;
      letter-spacing: -0.5px;
    }

    /* กล่องสำหรับช่องพิมพ์ข้อความ */
    .input-wrapper {
      background: #ffffff;
      padding: 8px 18px 8px 24px;
      border-radius: 50px;
      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.05); /* เงานุ่มจางๆ สบายตา */
      display: flex;
      align-items: center;
      width: 100%;
      border: 1px solid #dbe6df;
      transition: all 0.2s ease;
    }

    .input-wrapper:focus-within {
      border-color: #7da890;
      box-shadow: 0 3px 18px rgba(0, 0, 0, 0.08);
    }

    /* ช่องพิมพ์ข้อความ */
    textarea {
      flex-grow: 1;
      border: none;
      outline: none;
      font-size: 16px;
      color: #2d3b34;
      padding: 12px 0;
      height: 48px;
      resize: none;
      background: transparent;
      line-height: 24px;
    }

    textarea::placeholder {
      color: #9eb0a6;
    }

    /* ปุ่มส่งคำสั่ง */
    button {
      background: #edf5f0;
      border: 1px solid #d4e3d9;
      color: #24523a;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      padding: 9px 20px;
      border-radius: 50px;
      transition: all 0.2s ease;
      margin-left: 10px;
      white-space: nowrap;
    }

    button:hover {
      background-color: #3b6e52;
      border-color: #3b6e52;
      color: #ffffff;
    }

    /* ส่วนติดต่อทีมพัฒนา */
    .contact-info {
      margin-top: 28px;
      font-size: 14px;
      color: #6d7f75;
    }

    .contact-info a {
      color: #2e6648;
      text-decoration: none;
      font-weight: 500;
    }

    .contact-info a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Dynamic Mathsheets</h1>

    <div class="input-wrapper">
      <textarea id="commandInput" placeholder="พิมพ์คำสั่งหรือข้อความที่นี่..."></textarea>
      <button type="button" onclick="sendCommand()">ส่งคำสั่ง</button>
    </div>

    <div class="contact-info">
      ติดต่อทีมผู้พัฒนา: 
      <a href="mailto:dynamic.mathsheets@gmail.com">dynamic.mathsheets@gmail.com</a>
    </div>
  </div>

  <script>
    function sendCommand() {
      const input = document.getElementById('commandInput').value.trim();
      if (!input) return;

      alert('ส่งคำสั่งเรียบร้อย: ' + input);
      document.getElementById('commandInput').value = '';
    }

    document.getElementById('commandInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendCommand();
      }
    });
  </script>

</body>
</html>
