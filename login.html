<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - Dynamic Math Sheets</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Prompt', sans-serif; 
    }
    body { 
      background: #f8fafc; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
      padding: 16px; 
    }
    .card { 
      background: #fff; 
      width: 100%; 
      max-width: 420px; 
      padding: 36px 28px; 
      border-radius: 16px; 
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01); 
      text-align: center; 
    }
    h2 { 
      font-size: 1.4rem; 
      margin-bottom: 24px; 
      color: #0f172a; 
      font-weight: 600;
    }
    .form-group { 
      text-align: left; 
      margin-bottom: 18px; 
    }
    label { 
      display: block; 
      font-size: 0.9rem; 
      margin-bottom: 6px; 
      color: #334155; 
      font-weight: 500;
    }
    input { 
      width: 100%; 
      padding: 12px 14px; 
      border: 1.5px solid #cbd5e1; 
      border-radius: 8px; 
      font-size: 0.95rem; 
      outline: none; 
      transition: border-color 0.2s, box-shadow 0.2s; 
    }
    input:focus { 
      border-color: #2563eb; 
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); 
    }
    button { 
      width: 100%; 
      padding: 13px; 
      background: #2563eb; 
      color: #fff; 
      border: none; 
      border-radius: 8px; 
      font-size: 1rem; 
      cursor: pointer; 
      margin-top: 10px; 
      font-weight: 500; 
      transition: background 0.2s; 
    }
    button:hover { 
      background: #1d4ed8; 
    }
    button:disabled { 
      background: #94a3b8; 
      cursor: not-allowed; 
    }
    #msg { 
      margin-top: 16px; 
      padding: 12px 14px; 
      border-radius: 8px; 
      font-size: 0.88rem; 
      line-height: 1.6; 
      background: #fef2f2; 
      color: #dc2626; 
      border: 1px solid #fee2e2; 
      display: none; 
      text-align: left; 
    }
    .footer { 
      margin-top: 24px; 
      font-size: 0.87rem; 
      color: #64748b; 
    }
    .footer a { 
      color: #2563eb; 
      text-decoration: none; 
      font-weight: 500; 
    }
    .footer a:hover { 
      text-decoration: underline; 
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>เข้าสู่ระบบ Dynamic Mathsheets</h2>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">อีเมล (E-Mail)</label>
        <input type="email" id="email" placeholder="example@email.com" autocomplete="username" required>
      </div>

      <div class="form-group">
        <label for="pass">รหัสผ่าน (Password)</label>
        <input type="password" id="pass" placeholder="••••••••" autocomplete="current-password" required>
      </div>

      <button type="submit" id="btnSubmit">เข้าสู่ระบบ</button>
    </form>

    <div id="msg"></div>

    <div class="footer">
      ยังไม่มีบัญชี? <a href="DMSMember.html">สมัครสมาชิก</a>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby1xfgp5uhHnlB5spDJRrpRGWdaNnYOXc4yBIb3p12uMpAxEnNCk4E2u9AlmRtRg_Pz/exec";

    function requestJSONP(params, timeoutMs = 15000) {
      return new Promise((resolve, reject) => {
        const cb = "cb_" + Math.round(100000 * Math.random());
        const script = document.createElement("script");
        
        const timer = setTimeout(() => {
          cleanup();
          reject(new Error("การเชื่อมต่อหมดเวลา (Timeout) กรุณาลองใหม่อีกครั้ง"));
        }, timeoutMs);

        function cleanup() {
          clearTimeout(timer);
          try { delete window[cb]; } catch(e){}
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[cb] = (data) => {
          cleanup();
          resolve(data);
        };

        script.onerror = () => {
          cleanup();
          reject(new Error("ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาตรวจสอบอินเทอร์เน็ต"));
        };

        const queryString = Object.keys(params)
          .map(k => `${encodeURIComponent(k)}=${encodeURIComponent(params[k])}`)
          .join("&");

        script.src = `${SCRIPT_URL}?${queryString}&callback=${cb}`;
        document.body.appendChild(script);
      });
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById("btnSubmit");
      const msg = document.getElementById("msg");
      const email = document.getElementById("email").value.trim().toLowerCase();
      const pass = document.getElementById("pass").value.trim();

      btn.disabled = true;
      btn.textContent = "กำลังตรวจสอบ...";
      msg.style.display = "none";

      try {
        const res = await requestJSONP({
          action: "login",
          email: email,
          pass: pass
        });

        if (res && res.status === "success") {
          // เก็บค่าตัวแปรสำคัญลง localStorage ตามที่ระบุ
          localStorage.setItem("dms_is_logged_in", "true");
          localStorage.setItem("dms_user_email", email);
          localStorage.setItem("dms_user_name", res.user.name || "");
          localStorage.setItem("dms_user_role", res.user.role || "");
          localStorage.setItem("dms_expire_date", res.user.expireDate || "ตลอดชีพ");

          // ล็อกอินสำเร็จ นำทางไปหน้าเมนูหลัก
          window.location.replace("index.html");

        } else if (res && res.status === "expired") {
          // กรณีบัญชีหมดอายุการใช้งาน
          if (res.role === "นักเรียน") {
            msg.innerHTML = "บัญชีของคุณหมดอายุการใช้งานแล้ว<br><b>กรุณาติดต่อครูผู้สอน</b> เพื่อต่ออายุการใช้งาน";
          } else {
            msg.innerHTML = "บัญชีของคุณหมดอายุการใช้งานแล้ว<br>กรุณาติดต่อแอดมินทางอีเมล: <b>dynamic.mathsheets@gmail.com</b> เพื่อต่ออายุการใช้งาน";
          }
          msg.style.display = "block";

        } else {
          // กรณีรหัสผ่านผิด หรือไม่พบบัญชี
          msg.textContent = (res && res.message) ? res.message : "อีเมลหรือรหัสผ่านไม่ถูกต้อง";
          msg.style.display = "block";
        }
      } catch (err) {
        msg.textContent = err.message || "เกิดข้อผิดพลาดในการเชื่อมต่อ";
        msg.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "เข้าสู่ระบบ";
      }
    });
  </script>
</body>
</html>
