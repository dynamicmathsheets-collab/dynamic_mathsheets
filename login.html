<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - Dynamic Math Sheets</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', sans-serif; }
    body { background: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
    .card { background: #fff; width: 100%; max-width: 380px; padding: 32px 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
    h2 { font-size: 1.3rem; margin-bottom: 20px; color: #1e293b; }
    .form-group { text-align: left; margin-bottom: 16px; }
    label { display: block; font-size: 0.9rem; margin-bottom: 6px; color: #334155; }
    input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none; }
    input:focus { border-color: #2563eb; }
    button { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; margin-top: 8px; font-weight: 500; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #94a3b8; }
    #msg { margin-top: 14px; padding: 10px; border-radius: 6px; font-size: 0.85rem; background: #fef2f2; color: #ef4444; border: 1px solid #fecaca; display: none; }
    .footer { margin-top: 18px; font-size: 0.85rem; color: #64748b; }
    .footer a { color: #2563eb; text-decoration: none; }
  </style>
</head>
<body>

  <div class="card">
    <h2>เข้าสู่ระบบ</h2>

    <form id="loginForm">
      <div class="form-group">
        <label>อีเมล (E-Mail)</label>
        <input type="email" id="email" placeholder="example@email.com" required>
      </div>

      <div class="form-group">
        <label>รหัสผ่าน (Password)</label>
        <input type="password" id="pass" placeholder="••••••••" required>
      </div>

      <button type="submit" id="btnSubmit">เข้าสู่ระบบ</button>
    </form>

    <div id="msg"></div>

    <div class="footer">
      ยังไม่มีบัญชี? <a href="DMSMember.html">สมัครสมาชิก</a>
    </div>
  </div>

  <script>
    // URL Web App จาก Apps Script ของคุณ
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby1xfgp5uhHnlB5spDJRrpRGWdaNnYOXc4yBIb3p12uMpAxEnNCk4E2u9AlmRtRg_Pz/exec";

    // ถ้าเคยล็อกอินแล้ว ไม่ต้องล็อกอินซ้ำ ให้เด้งไปหน้าหลักเลย
    if (localStorage.getItem("dms_is_logged_in") === "true") {
      window.location.replace("index.html");
    }

    // ฟังก์ชันยิงข้อมูลไปหา Google Apps Script
    function requestJSONP(params) {
      return new Promise((resolve, reject) => {
        const cb = "cb_" + Math.round(100000 * Math.random());
        const s = document.createElement("script");
        window[cb] = (data) => { delete window[cb]; s.remove(); resolve(data); };
        s.onerror = () => { delete window[cb]; s.remove(); reject(new Error("เชื่อมต่อระบบไม่สำเร็จ")); };
        const q = Object.keys(params).map(k => `${encodeURIComponent(k)}=${encodeURIComponent(params[k])}`).join("&");
        s.src = `${SCRIPT_URL}?${q}&callback=${cb}`;
        document.body.appendChild(s);
      });
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btnSubmit");
      const msg = document.getElementById("msg");
      const email = document.getElementById("email").value.trim().toLowerCase();
      const pass = document.getElementById("pass").value.trim();

      btn.disabled = true;
      btn.textContent = "กำลังตรวจสอบ...";
      msg.style.display = "none";

      try {
        const res = await requestJSONP({ action: "login", email: email, pass: pass });

        if (res.status === "success") {
          // เก็บข้อมูลลงเครื่อง แล้วเปลี่ยนหน้าทันที
          localStorage.setItem("dms_is_logged_in", "true");
          localStorage.setItem("dms_user_email", email);
          localStorage.setItem("dms_user_name", res.user.name);
          localStorage.setItem("dms_user_role", res.user.role);
          window.location.replace("index.html");
        } else {
          msg.textContent = res.message || "อีเมลหรือรหัสผ่านไม่ถูกต้อง";
          msg.style.display = "block";
        }
      } catch (err) {
        msg.textContent = err.message;
        msg.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "เข้าสู่ระบบ";
      }
    });
  </script>
</body>
</html>
