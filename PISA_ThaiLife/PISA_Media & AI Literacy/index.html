<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ความฉลาดรู้ด้านสื่อและปัญญาประดิษฐ์ (Media & AI Literacy)</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #333;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    /* แถบบาร์ด้านบน (Top Navigation Bar) - สไตล์ Tech & AI สี Deep Indigo & Cyan */
    .top-navbar {
      background: linear-gradient(135deg, #09101d 0%, #111827 50%, #1e1b4b 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      flex-wrap: wrap;
      z-index: 100;
    }
    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0.85rem 0;
      white-space: nowrap;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-icon {
      width: 24px;
      height: 24px;
      color: #38bdf8;
      display: inline-flex;
    }
    .nav-links {
      display: flex;
      list-style: none;
      gap: 0.4rem;
      overflow-x: auto;
      padding: 0.4rem 0;
    }
    .nav-item button {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      font-size: 0.88rem;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.25s ease;
      white-space: nowrap;
    }
    .nav-item button:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: #38bdf8;
      color: #fff;
    }
    .nav-item button.active {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      border-color: #38bdf8;
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }
    /* พื้นที่แสดงผลเนื้อหา (Iframe Container) */
    .content-container {
      flex: 1;
      width: 100%;
      height: calc(100vh - 60px);
      position: relative;
      background: #fff;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- แถบบาร์ด้านบน -->
  <header class="top-navbar">
    <div class="brand-title">
      <!-- ไอคอนรูปสมองกล / AI & Chip -->
      <svg class="brand-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.38-1 1.72V7h2a3 3 0 0 1 3 3v1h1a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-1v1a3 3 0 0 1-3 3h-2v1.28c.6.34 1 .98 1 1.72a2 2 0 0 1-4 0c0-.74.4-1.38 1-1.72V20H9a3 3 0 0 1-3-3v-1H5a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2h1v-1a3 3 0 0 1 3-3h2V5.72c-.6-.34-1-.98-1-1.72a2 2 0 0 1 2-2m-1 7H9a1 1 0 0 0-1 1v1h3V9m4 0v2h3v-1a1 1 0 0 0-1-1h-2m-4 4H9v2h2v-2m4 0v2h2a1 1 0 0 0 1-1v-1h-3z"/>
      </svg>
      ความฉลาดรู้ด้านสื่อและปัญญาประดิษฐ์ (Media & AI Literacy)
    </div>
    
    <nav>
      <ul class="nav-links">
        <li class="nav-item">
          <button class="active" onclick="loadPage('PISAMAIL_Civic %26 Public1.html', this)">Civic & Public 1</button>
        </li>
        <li class="nav-item">
          <button onclick="loadPage('PISAMAIL_Civic %26 Public2.html', this)">Civic & Public 2</button>
        </li>
        <li class="nav-item">
          <button onclick="loadPage('PISAMAIL_Educational %26 Academic1.html', this)">Educational & Academic 1</button>
        </li>
        <li class="nav-item">
          <button onclick="loadPage('PISAMAIL_Educational %26 Academic2.html', this)">Educational & Academic 2</button>
        </li>
        <li class="nav-item">
          <button onclick="loadPage('PISAMAIL_Ethics %26 Cyber Safety1.html', this)">Ethics & Cyber Safety 1</button>
        </li>
        <li class="nav-item">
          <button onclick="loadPage('PISAMAIL_Ethics %26 Cyber Safety2.html', this)">Ethics & Cyber Safety 2</button>
        </li>
        <li class="nav-item">
          <button onclick="loadPage('PISAMAIL_Personal %26 Digital Life1.html', this)">Personal & Digital Life 1</button>
        </li>
        <li class="nav-item">
          <button onclick="loadPage('PISAMAIL_Personal %26 Digital Life2.html', this)">Personal & Digital Life 2</button>
        </li>
      </ul>
    </nav>
  </header>

  <!-- กรอบสำหรับแสดงหน้าเว็บที่เลือก -->
  <main class="content-container">
    <iframe id="mainViewer" src="PISAMAIL_Civic %26 Public1.html" title="Viewer"></iframe>
  </main>

  <script>
    function loadPage(url, btn) {
      // เปลี่ยนหน้าใน iframe
      document.getElementById('mainViewer').src = url;
      
      // ปรับสถานะปุ่มที่เลือก
      const buttons = document.querySelectorAll('.nav-links button');
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>
</body>
</html>
