<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ความฉลาดรู้ด้านปัญญาประดิษฐ์ (AI Literacy)</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0f19;
      color: #333;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    /* แถบบาร์ด้านบน (Top Navigation Bar) - สไตล์ AI ล้ำสมัย โทนม่วงนีออน-น้ำเงินเข้ม */
    .top-navbar {
      background: linear-gradient(135deg, #090d16 0%, #1e1b4b 50%, #311042 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      border-bottom: 1px solid rgba(168, 85, 247, 0.3);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      flex-wrap: wrap;
      z-index: 100;
    }
    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0.85rem 0;
      white-space: nowrap;
      background: linear-gradient(90deg, #c084fc, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-icon {
      width: 24px;
      height: 24px;
      fill: #c084fc;
      flex-shrink: 0;
    }
    .nav-links {
      display: flex;
      list-style: none;
      gap: 0.35rem;
      overflow-x: auto;
      padding: 0.4rem 0;
    }
    .nav-item button {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      padding: 0.45rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.25s ease;
      white-space: nowrap;
    }
    .nav-item button:hover {
      background: rgba(192, 132, 252, 0.2);
      border-color: #c084fc;
      color: #fff;
    }
    .nav-item button.active {
      background: linear-gradient(135deg, #7c3aed, #9333ea);
      border-color: #d8b4fe;
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.5);
    }
    /* พื้นที่แสดงผลเนื้อหา (Iframe Container) */
    .content-container {
      flex: 1;
      width: 100%;
      height: calc(100vh - 60px);
      position: relative;
      background: #fff;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- แถบบาร์ด้านบน -->
  <header class="top-navbar">
    <div class="brand-title">
      <!-- ไอคอน Sparkles / AI Intelligence -->
      <svg class="brand-icon" viewBox="0 0 24 24">
        <path d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15z"/>
      </svg>
      ความฉลาดรู้ด้านปัญญาประดิษฐ์ (AI Literacy)
    </div>
    
    <nav>
      <ul class="nav-links">
        <li class="nav-item">
          <button class="active" onclick="loadPage('PISAAIL_Civics1.html', this)">Civics 1</button>
        </li>
        <li class="nav-item">
          <button onclick="loadPage('PISAAIL_Civics2.html', this)">Civics 2</button>
        </li>
        <li class="nav-item">
          <button onclick="loadPage('PISAAIL_Daily%20Life1.html', this)">Daily Life 1</button>
        </li>
        <li class="nav-item">
          <button onclick="loadPage('PISAAIL_Daily%20Life2.html', this)">Daily Life 2</button>
        </li>
        <li class="nav-item">
          <button onclick="loadPage('PISAAIL_Ethics%20%26%20Safety1.html', this)">Ethics & Safety 1</button>
        </li>
        <li class="nav-item">
          <button onclick="loadPage('PISAAIL_Ethics%20%26%20Safety2.html', this)">Ethics & Safety 2</button>
        </li>
        <li class="nav-item">
          <button onclick="loadPage('PISAAIL_Learning1.html', this)">Learning 1</button>
        </li>
        <li class="nav-item">
          <button onclick="loadPage('PISAAIL_Learning2.html', this)">Learning 2</button>
        </li>
        <li class="nav-item">
          <button onclick="loadPage('PISAAIL_Problem%20Solving1.html', this)">Problem Solving 1</button>
        </li>
        <li class="nav-item">
          <button onclick="loadPage('PISAAIL_Problem%20Solving2.html', this)">Problem Solving 2</button>
        </li>
      </ul>
    </nav>
  </header>

  <!-- กรอบสำหรับแสดงหน้าเว็บที่เลือก -->
  <main class="content-container">
    <iframe id="mainViewer" src="PISAAIL_Civics1.html" title="Viewer"></iframe>
  </main>

  <script>
    function loadPage(url, btn) {
      // เปลี่ยนหน้าใน iframe
      document.getElementById('mainViewer').src = url;
      
      // ปรับสถานะปุ่มที่เลือก
      const buttons = document.querySelectorAll('.nav-links button');
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>
</body>
</html>
