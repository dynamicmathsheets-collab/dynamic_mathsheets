<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ความฉลาดรู้เรื่องดิจิทัลและความรู้ความเข้าใจด้านเทคโนโลยี (Digital & Technology Literacy)</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #333;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    /* แถบบาร์ด้านบน (Top Navigation Bar) - สไตล์ Modern Tech สี Dark Slate & Electric Indigo */
    .top-navbar {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #312e81 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
      flex-wrap: wrap;
      z-index: 100;
      border-bottom: 1px solid rgba(99, 102, 241, 0.3);
    }
    .brand-title {
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0.85rem 0;
      white-space: nowrap;
      background: linear-gradient(90deg, #60a5fa, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-icon {
      width: 24px;
      height: 24px;
      fill: #60a5fa;
      flex-shrink: 0;
    }
    .nav-links {
      display: flex;
      list-style: none;
      gap: 0.35rem;
      overflow-x: auto;
      padding: 0.4rem 0;
    }
    .nav-item button {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #e2e8f0;
      padding: 0.45rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .nav-item button:hover {
      background: rgba(99, 102, 241, 0.25);
      border-color: #818cf8;
      color: #fff;
    }
    .nav-item button.active {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      border-color: #a5b4fc;
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
    }
    /* พื้นที่แสดงผลเนื้อหา (Iframe Container) */
    .content-container {
      flex: 1;
      width: 100%;
      height: calc(100vh - 60px);
      position: relative;
      background: #fff;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- แถบบาร์ด้านบน -->
  <header class="top-navbar">
    <div class="brand-title">
      <!-- ไอคอนแล็ปท็อป/เทคโนโลยี -->
      <svg class="brand-icon" viewBox="0 0 24 24">
        <path d="M20 18c1.1 0 1.99-.9 1.99-2L22 5c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2H0c0 1.1.9 2 2 2h20c1.1 0 2-.9 2-2h-4zM4 5h16v11H4V5zm8 14c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/>
      </svg>
      ความฉลาดรู้เรื่องดิจิทัลและความรู้ความเข้าใจด้านเทคโนโลยี (Digital & Technology Literacy)
    </div>
    
    <nav>
      <ul class="nav-links">
        <li class="nav-item">
          <button class="active" onclick="loadPage('PISADTL_Communication1.html', this)">Communication 1</button>
        </li>
        <li class="nav-item">
          <button onclick="loadPage('PISADTL_Communication2.html', this)">Communication 2</button>
        </li>
        <li class="nav-item">
          <button onclick="loadPage('PISADTL_Digital Services1.html', this)">Digital Services 1</button>
        </li>
        <li class="nav-item">
          <button onclick="loadPage('PISADTL_Digital Services2.html', this)">Digital Services 2</button>
        </li>
        <li class="nav-item">
          <button onclick="loadPage('PISADTL_Learning1.html', this)">Learning 1</button>
        </li>
        <li class="nav-item">
          <button onclick="loadPage('PISADTL_Learning2.html', this)">Learning 2</button>
        </li>
        <li class="nav-item">
          <button onclick="loadPage('PISADTL_Problem Solving1.html', this)">Problem Solving 1</button>
        </li>
        <li class="nav-item">
          <button onclick="loadPage('PISADTL_Problem Solving2.html', this)">Problem Solving 2</button>
        </li>
        <li class="nav-item">
          <button onclick="loadPage('PISADTL_Safety1.html', this)">Safety 1</button>
        </li>
        <li class="nav-item">
          <button onclick="loadPage('PISADTL_Safety2.html', this)">Safety 2</button>
        </li>
      </ul>
    </nav>
  </header>

  <!-- กรอบสำหรับแสดงหน้าเว็บที่เลือก -->
  <main class="content-container">
    <iframe id="mainViewer" src="PISADTL_Communication1.html" title="Viewer"></iframe>
  </main>

  <script>
    function loadPage(url, btn) {
      // เปลี่ยนหน้าใน iframe
      document.getElementById('mainViewer').src = url;
      
      // ปรับสถานะปุ่มที่เลือก
      const buttons = document.querySelectorAll('.nav-links button');
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>
</body>
</html>
